<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#1c1917"/>
			<stop offset="100%" stop-color="#0c0a09"/>
		</linearGradient>
		<linearGradient id="grad-lower" x1="0.3" y1="0" x2="0.8" y2="1">
			<stop offset="0%" stop-color="#9a3412"/>
			<stop offset="100%" stop-color="#e04e0c"/>
		</linearGradient>
	</defs>

	<g transform="translate(102, 102) scale(0.8)">
		<!-- Background -->
		<rect width="1024" height="1024" rx="220" fill="url(#bg-grad)"/>

		<!-- Lower piece (behind) — darker near the upper piece, lighter away -->
		<path
			d="M 220,512 L 220,800 Q 220,820 240,820 L 780,820 Q 810,820 790,800 L 510,512 Z"
			fill="url(#grad-lower)"
		/>

		<!-- Upper piece (in front, solid) -->
		<path
			d="M 240,200 Q 220,200 220,220 L 220,800 Q 220,820 232,812 L 500,530 Q 512,518 524,506 L 790,218 Q 800,200 780,200 Z"
			fill="#f97316"
		/>
	</g>
</svg>
